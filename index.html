  <style>
:root {
  --form-bg:#111315;
  --card-bg:#191d20;
  --card-header-bg:#1e2322;
  --input-bg:#14181a;
  --grid-header-bg:#242a2b;
  --border:#343a3d;
  --text-primary:#e8edeb;
  --text-muted:#a4aeab;
  --accent:#206c4c;
  --accent-hover:#277654;
  --secondary:#24292c;
  --secondary-hover:#30363a;
  --selection:#244f40;
  --focus:#48a47c;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; background:#0d0f10; }
body { min-width:320px; margin:0; background:#0d0f10; color:var(--text-primary); font-family:"Segoe UI","Apple SD Gothic Neo",sans-serif; -webkit-text-size-adjust:100%; }
button,select { font:inherit; }
.hero { width:min(100%,390px); margin:0 auto; border-bottom:1px solid var(--border); background:var(--card-bg); }
.hero__inner { padding:calc(12px + env(safe-area-inset-top)) 14px 12px; }
h1 { margin:0; font-family:"Segoe UI Semibold","Segoe UI",sans-serif; font-size:20px; line-height:1.2; }
#trip-distance { margin:4px 0 0; color:var(--text-muted); font-size:11px; font-weight:600; }
.page { width:min(100%,390px); margin:0 auto; padding:10px 10px calc(28px + env(safe-area-inset-bottom)); background:var(--form-bg); }
.trip-tabs { display:flex; gap:6px; margin-bottom:8px; overflow-x:auto; scrollbar-width:none; }
.trip-tabs::-webkit-scrollbar { display:none; }
.trip-tabs button { flex:0 0 auto; min-height:36px; padding:7px 11px; border:1px solid var(--border); border-bottom:3px solid transparent; border-radius:6px; background:var(--secondary); color:var(--text-muted); font-size:12px; font-weight:600; cursor:pointer; }
.trip-tabs button.active { border-color:var(--accent); border-bottom-color:var(--focus); background:var(--selection); color:var(--text-primary); }
.day-tabs { display:grid; grid-template-columns:repeat(var(--day-count,3),1fr); overflow:hidden; border:1px solid var(--border); border-radius:8px; background:var(--card-bg); }
.day-tabs button { min-width:0; appearance:none; position:relative; border:0; border-right:1px solid var(--border); padding:10px 8px 12px; background:var(--card-bg); color:var(--text-muted); text-align:left; cursor:pointer; }
.day-tabs button:last-child { border-right:0; }
.day-tabs button::after { content:""; height:3px; position:absolute; left:8px; right:8px; bottom:0; border-radius:3px 3px 0 0; background:var(--focus); transform:scaleX(0); }
.day-tabs button.active { background:var(--selection); color:var(--text-primary); }
.day-tabs button.active::after { transform:scaleX(1); }
.day-tabs small,.day-tabs span { display:block; overflow:hidden; font-size:10px; white-space:nowrap; text-overflow:ellipsis; }
.day-tabs strong { display:block; margin:2px 0; font-size:15px; }
.view-switch { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:8px; padding:3px; border:1px solid var(--border); border-radius:7px; background:var(--input-bg); }
.view-switch button { min-height:36px; border:0; border-radius:5px; background:transparent; color:var(--text-muted); font-size:12px; font-weight:700; cursor:pointer; }
.view-switch button.active { background:var(--selection); color:var(--text-primary); box-shadow:inset 0 0 0 1px var(--accent); }
.view-panel[hidden] { display:none; }
.card { margin-top:10px; padding:12px; background:var(--card-bg); border:1px solid var(--border); border-radius:8px; }
.day-overview { margin-top:8px; }
.section-head { display:flex; align-items:flex-start; flex-direction:column; gap:12px; margin-bottom:12px; }
.section-head h2,.route-heading h2 { margin:0; font-family:"Segoe UI Semibold","Segoe UI",sans-serif; font-size:20px; }
.route-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; width:100%; }
.day-distance { flex:0 0 auto; margin-bottom:2px; color:var(--focus); font-size:12px; font-weight:700; white-space:nowrap; }
.section-label { margin:0 0 5px; color:var(--focus); font-size:11px; font-weight:700; letter-spacing:.1em; }
.route-tools { width:100%; margin-top:12px; }
.route-range { width:100%; display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:7px; color:var(--text-muted); font-size:11px; }
.route-range label { min-width:0; display:flex; align-items:flex-start; flex-direction:column; gap:5px; }
.route-range select { width:100%; min-height:38px; border:1px solid var(--border); border-radius:5px; background:var(--input-bg); color:var(--text-primary); }
.route-range select { padding:6px 24px 6px 8px; font-size:12px; }
.route-actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:7px; }
.route-actions button { min-height:38px; border:1px solid var(--border); border-radius:5px; background:var(--input-bg); color:var(--text-primary); font-size:12px; font-weight:600; cursor:pointer; }
.route-actions button:first-child { border-color:var(--accent); background:var(--selection); }
.route-range select:focus-visible,.route-actions button:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
.day-feedback { margin:7px 1px 0; color:var(--focus); font-size:11px; line-height:1.4; }
.day-feedback:empty { display:none; }
.legend { display:none; }
.map-wrap { overflow:hidden; border:1px solid var(--border); border-radius:6px; background:var(--input-bg); }
#route-map { width:100%; height:440px; background:#dceef1; }
.route-pin { display:flex; align-items:center; justify-content:center; width:28px; height:28px; border:2px solid var(--text-primary); border-radius:50%; background:var(--pin-color); color:var(--text-primary); font-size:12px; font-weight:700; box-shadow:0 3px 8px #0008; }
.route-pin.is-combined { width:40px; border-radius:15px; }
.leaflet-tooltip.place-label { padding:3px 5px; border:1px solid var(--border); border-radius:4px; background:#191d20e8; color:var(--text-primary); font-size:10px; font-weight:600; box-shadow:0 1px 5px #0008; }
.leaflet-tooltip.place-label::before { display:none; }
.leaflet-control-attribution { font-size:9px; }
.route-summary { margin:12px 2px 0; color:var(--text-primary); font-size:13px; font-weight:600; line-height:1.6; }
.route-note { margin:8px 0 0; padding:10px 11px; border-left:3px solid var(--accent); background:var(--input-bg); color:var(--text-muted); font-size:12px; line-height:1.55; }
.map-caption { margin:7px 2px 0; color:#e8c873; font-size:10px; line-height:1.4; }
.panel-meta { min-height:14px; margin-bottom:7px; color:var(--text-muted); font-size:10.5px; text-align:right; }
.table-wrap { border:0; }
table,tbody { display:block; width:100%; }
thead { display:none; }
tbody { display:grid; gap:7px; }
tbody tr { position:relative; display:block; padding:11px 12px; border:1px solid var(--border); border-radius:6px; background:var(--input-bg); }
tbody tr.movement-row { padding:3px 8px; border:0; background:transparent; }
.schedule-item { display:block; padding:0; border:0; background:transparent; overflow-wrap:anywhere; }
.schedule-time { display:block; margin-bottom:5px; color:var(--focus); font-size:11px; font-weight:700; }
.schedule-place { display:block; color:var(--text-primary); font-size:15px; font-weight:700; line-height:1.4; }
.schedule-place-row,.candidate-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.naver-map-link { flex:0 0 auto; display:inline-flex; align-items:center; min-height:28px; padding:4px 7px; border:1px solid #03c75a; border-radius:5px; background:#10251a; color:#63df93; font-size:10.5px; font-weight:700; line-height:1; text-decoration:none; white-space:nowrap; }
.schedule-detail { display:block; margin-top:6px; padding-top:6px; border-top:1px solid var(--border); color:var(--text-muted); font-size:11px; line-height:1.4; }
.travel-group { margin-top:8px; border-top:1px solid var(--border); }
.traveler-row { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:start; gap:8px; padding:10px 0; }
.traveler-row + .traveler-row { border-top:1px solid var(--border); }
.traveler-badge { min-width:64px; padding:4px 6px; border:1px solid var(--accent); border-radius:999px; background:var(--selection); color:var(--text-primary); font-size:10.5px; font-weight:700; text-align:center; white-space:nowrap; }
.traveler-route { display:block; color:var(--text-primary); font-size:12.5px; font-weight:700; line-height:1.5; }
.traveler-note { display:block; margin-top:2px; color:var(--text-muted); font-size:11px; line-height:1.4; }
.travel-meeting { padding:9px 10px; border-left:3px solid var(--focus); background:var(--secondary); color:var(--text-primary); font-size:12px; font-weight:700; }
.movement-line { display:grid; grid-template-columns:18px minmax(0,1fr); gap:5px; align-items:center; color:var(--text-muted); }
.movement-arrow { color:var(--focus); font-size:18px; font-weight:700; line-height:1; text-align:center; }
.movement-summary { display:block; color:var(--text-primary); font-size:11.5px; font-weight:700; line-height:1.4; }
.movement-route { display:block; margin-top:1px; color:var(--text-muted); font-size:10.5px; line-height:1.4; }

.candidate-toggle { flex:0 0 auto; color:var(--focus); font-size:12px; font-weight:600; white-space:nowrap; }
.candidate-close-label { display:none; }
.candidate-details[open] .candidate-open-label { display:none; }
.candidate-details[open] .candidate-close-label { display:inline; }
.candidate-list { border-top:1px solid var(--border); }
.candidate-item { padding:10px 0; }
.candidate-item + .candidate-item { border-top:1px solid var(--border); }
.candidate-name { display:block; color:var(--text-primary); font-size:14px; font-weight:700; line-height:1.4; }
.candidate-menu { display:block; margin-top:3px; color:var(--text-muted); font-size:12.5px; line-height:1.45; }

@media print {
  .trip-tabs,.day-tabs,.view-switch,.route-tools,.back-to-top { display:none; }
  .view-panel { display:block!important; }
  .card { break-inside:avoid; }
}

const tripTabs = document.querySelector(".trip-tabs");
const dayTabs = document.querySelector(".day-tabs");
let activeTrip = trips[0];
const map = L.map("route-map", { zoomControl: true });
const routeLayers = L.layerGroup().addTo(map);
const routeStart = document.getElementById("route-start");
const routeEnd = document.getElementById("route-end");
let routeRequestId = 0;
let activePlan;
let activeDayKey;
let activeView = "schedule";
let feedbackTimer;
const roadRouteCache = new Map();
const dayDistanceCache = new Map();

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"
}).addTo(map);

function segmentLocations(plan, segment) {
  return segment.points.map(index => {
    const [, lon, lat] = plan.points[index];
    return [lon, lat];
  });
}

function distanceBetween([lat1, lon1], [lat2, lon2]) {
  const toRadians = value => value * Math.PI / 180;
  const earthRadius = 6371000;
  const latDelta = toRadians(lat2 - lat1);
  const lonDelta = toRadians(lon2 - lon1);
  const a = Math.sin(latDelta / 2) ** 2 + Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) * Math.sin(lonDelta / 2) ** 2;
  return 2 * earthRadius * Math.asin(Math.sqrt(a));
}

function polylineDistance(locations) {
  return locations.slice(1).reduce((total, location, index) => total + distanceBetween(locations[index], location), 0);
}

function loadRoadRoute(plan, segment) {
  const locations = segmentLocations(plan, segment);
  const routeLocations = locations.map(([lon, lat]) => [lat, lon]);
  if (segment.mode === "cable")
    return Promise.resolve({ locations: routeLocations, distanceMeters: polylineDistance(routeLocations) });

  const server = segment.mode === "foot" ? "https://routing.openstreetmap.de/routed-foot" : "https://router.project-osrm.org";
  const coordinates = locations.map(([lon, lat]) => `${lon},${lat}`).join(";");
  const cacheKey = `${server}|${coordinates}`;
  if (roadRouteCache.has(cacheKey))
    return roadRouteCache.get(cacheKey);

  const request = fetch(`${server}/route/v1/driving/${coordinates}?overview=full&geometries=geojson`)
    .then(response => {
      if (!response.ok)
        throw new Error(`경로 서버 응답 오류: ${response.status}`);
      return response.json();
    })
    .then(data => {
      if (data.code !== "Ok" || !data.routes?.[0]?.geometry?.coordinates)
        throw new Error(data.message || "경로를 찾지 못했습니다.");
      return {
        locations: data.routes[0].geometry.coordinates.map(([lon, lat]) => [lat, lon]),
        distanceMeters: data.routes[0].distance
      };
    })
    .catch(error => {
      roadRouteCache.delete(cacheKey);
      throw error;
    });
  roadRouteCache.set(cacheKey, request);
  return request;
}

function calculateDayDistance(plan) {
  if (dayDistanceCache.has(plan))
    return dayDistanceCache.get(plan);

  const routes = plan.distanceRoutes?.map(indexes => indexes.map(index => plan.segments[index])) ?? [plan.segments];
  const request = Promise.all(routes.map(segments => Promise.allSettled(segments.map(segment => loadRoadRoute(plan, segment)))
    .then(results => results.reduce((total, result, index) => {
      if (result.status === "fulfilled")
        return total + result.value.distanceMeters;
      const fallbackLocations = segmentLocations(plan, segments[index]).map(([lon, lat]) => [lat, lon]);
      return total + polylineDistance(fallbackLocations);
    }, 0))))
    .then(distances => ({ min: Math.min(...distances), max: Math.max(...distances) }));
  dayDistanceCache.set(plan, request);
  return request;
}

function formatDistance(distanceRange, fractionDigits = 1) {
  const representativeDistance = (distanceRange.min + distanceRange.max) / 2;
  return `${(representativeDistance / 1000).toFixed(fractionDigits)}km`;
}

function refreshDayDistance(plan) {
  const distance = document.getElementById("day-distance");
  distance.textContent = "거리 계산 중…";
  calculateDayDistance(plan).then(distanceRange => {
    if (activePlan === plan)
      distance.textContent = `약 ${formatDistance(distanceRange)}`;
  });
}

async function refreshTripDistance(trip) {
  const distance = document.getElementById("trip-distance");
  distance.textContent = "이번 여행의 발자국 · 거리 계산 중…";
  const distances = await Promise.all(Object.values(trip.days).map(calculateDayDistance));
  const total = distances.reduce((sum, value) => ({ min: sum.min + value.min, max: sum.max + value.max }), { min: 0, max: 0 });
  if (activeTrip === trip)
    distance.textContent = `이번 여행의 발자국 · 총 약 ${formatDistance(total, 0)}`;
}

function filteredSegments(plan, startIdx, endIdx) {
  const isFullRoute = startIdx === 0 && endIdx === plan.points.length - 1;
  if (isFullRoute)
    return plan.segments;

  const segments = [];
  plan.segments.forEach(segment => {
    let run = [];
    for (let idx = 0; idx < segment.points.length - 1; idx++) {
      const start = segment.points[idx];
      const end = segment.points[idx + 1];
      const isSelected = start >= startIdx && end <= endIdx && start < end;
      if (isSelected) {
        if (run.length === 0) run.push(start);
        run.push(end);
      } else if (run.length > 0) {
        segments.push({ mode: segment.mode, points: run });
        run = [];
      }
    }
    if (run.length > 0)
      segments.push({ mode: segment.mode, points: run });
  });
  return segments;
}

async function drawMap(plan, startIdx, endIdx) {
  const requestId = ++routeRequestId;
  const status = document.getElementById("route-status");
  const bounds = L.latLngBounds();
  const segments = filteredSegments(plan, startIdx, endIdx);
  routeLayers.clearLayers();
  status.hidden = true;
  status.textContent = "";

  const visiblePoints = new Map();
  plan.points.forEach(([name, lon, lat], index) => {
    if (index < startIdx || index > endIdx)
      return;

    const locationKey = `${lon},${lat}`;
    if (!visiblePoints.has(locationKey))
      visiblePoints.set(locationKey, { lon, lat, names: [], indexes: [] });
    const point = visiblePoints.get(locationKey);
    point.names.push(name);
    point.indexes.push(index);
    bounds.extend([lat, lon]);
  });

  visiblePoints.forEach(({ lon, lat, names, indexes }) => {
    const isCombined = indexes.length > 1;
    const width = isCombined ? 42 : 30;
    const numbers = indexes.map(index => index + 1).join("·");
    const labels = [...new Set(names)].join(" / ");
    const directionIndex = indexes[0];
    const icon = L.divIcon({ className: "", html: `<span class="route-pin${isCombined ? " is-combined" : ""}" style="--pin-color:${plan.color}">${numbers}</span>`, iconSize: [width, 30], iconAnchor: [width / 2, 15] });
    L.marker([lat, lon], { icon }).bindTooltip(labels, { permanent: true, direction: directionIndex % 2 ? "bottom" : "top", className: "place-label", offset: [0, directionIndex % 2 ? 12 : -12] }).addTo(routeLayers);
  });

  map.fitBounds(bounds, { padding: [45, 45], maxZoom: 15 });
  setTimeout(() => map.invalidateSize(), 0);

  if (segments.length === 0) {
    status.textContent = "선택한 번호 사이에 이어지는 동선이 없습니다.";
    status.hidden = false;
    return;
  }

  const results = await Promise.allSettled(segments.map(segment => loadRoadRoute(plan, segment)));
  if (requestId !== routeRequestId)
    return;

  let failureCnt = 0;
  results.forEach((result, index) => {
    const segment = segments[index];
    let locations;
    if (result.status === "fulfilled") locations = result.value.locations;
    else {
      failureCnt++;
      locations = segmentLocations(plan, segment).map(([lon, lat]) => [lat, lon]);
    }

    L.polyline(locations, {
      color: plan.color,
      weight: segment.mode === "foot" ? 5 : 6,
      opacity: .88,
      dashArray: segment.mode === "foot" ? "3 9" : segment.mode === "cable" ? "12 9" : null,
      lineCap: "round",
      lineJoin: "round"
    }).addTo(routeLayers);
  });

  if (failureCnt > 0) {
    status.textContent = `일부 경로 ${failureCnt}개를 불러오지 못해 해당 구간만 직선으로 표시했습니다.`;
    status.hidden = false;
  }
}

function selectedRouteSummary(plan, startIdx, endIdx) {
  if (startIdx === 0 && endIdx === plan.points.length - 1)
    return plan.summary;

  return plan.points.slice(startIdx, endIdx + 1).map(([name], idx) => `${startIdx + idx + 1}. ${name}`).join(" → ");
}

function placeMatches(schedulePlace, pointName) {
  if (!schedulePlace)
    return false;

  const compactPlace = schedulePlace.replace(/\([^)]*\)/g, "").replace(/\s/g, "");
  const compactPoint = pointName.replace(/\([^)]*\)/g, "").replace(/\s/g, "");
  if (compactPlace.includes(compactPoint) || compactPoint.includes(compactPlace))
    return true;

  return pointName.split(/·|\/|또는/).map(value => value.replace(/\s/g, "")).filter(value => value.length > 1).some(value => compactPlace.includes(value));
}

function pointRowIndexes(plan) {
  let searchIdx = 0;
  return plan.points.map(([pointName]) => {
    let fallbackIdx = -1;
    let anchorIdx = -1;
    for (let rowIdx = searchIdx; rowIdx < plan.rows.length; rowIdx++) {
      const [, origin, dest] = plan.rows[rowIdx];
      if (!placeMatches(dest, pointName))
        continue;

      if (fallbackIdx < 0) fallbackIdx = rowIdx;
      if (!origin) {
        anchorIdx = rowIdx;
        break;
      }
    }
    const rowIdx = anchorIdx >= 0 ? anchorIdx : fallbackIdx;
    if (rowIdx >= 0) searchIdx = rowIdx;
    return rowIdx;
  });
}

function selectedScheduleRows(plan, startIdx, endIdx) {
  if (startIdx === 0 && endIdx === plan.points.length - 1)
    return plan.rows;

  const rowIndexes = pointRowIndexes(plan);
  const startRowIdx = rowIndexes[startIdx];
  const endRowIdx = rowIndexes[endIdx];
  if (startRowIdx < 0 || endRowIdx < startRowIdx)
    return [];

  return plan.rows.slice(startRowIdx, endRowIdx + 1);
}

function durationText(time) {
  const match = time.match(/^(\d{1,2}):(\d{2})~(\d{1,2}):(\d{2})$/);
  if (!match)
    return "";
  const [, startHour, startMinute, endHour, endMinute] = match.map(Number);
  let minutes = endHour * 60 + endMinute - (startHour * 60 + startMinute);
  if (minutes < 0) minutes += 24 * 60;
  return `${minutes}분`;
}

function localDateKey(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function rowStartMinutes(row) {
  const match = row[0].match(/^(\d{1,2}):(\d{2})/);
  return match ? Number(match[1]) * 60 + Number(match[2]) : null;
}

function findCurrentScheduleRow(plan, now = new Date()) {
  if (plan.isoDate !== localDateKey(now))
    return null;

  const timedRows = plan.rows.map(row => ({ row, start: rowStartMinutes(row) })).filter(item => item.start !== null);
  if (timedRows.length === 0)
    return null;

  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  if (nowMinutes < timedRows[0].start)
    return timedRows[0].row;

  for (let index = 0; index < timedRows.length; index++) {
    const nextStart = timedRows[index + 1]?.start ?? 24 * 60;
    if (nowMinutes >= timedRows[index].start && nowMinutes < nextStart)
      return timedRows[index].row;
  }
  return timedRows[timedRows.length - 1].row;
}

function naverMapUrl(plan, place, exactName = false) {
  const appname = `${location.origin}${location.pathname}`;
  if (!exactName) {
    const compact = value => value.replace(/\([^)]*\)/g, "").replace(/\s/g, "");
    const point = plan.points.find(([pointName]) => compact(pointName) === compact(place))
      ?? plan.points.find(([pointName]) => placeMatches(place, pointName));
    if (point) {
      const [name, lng, lat] = point;
      return `nmap://place?${new URLSearchParams({ lat, lng, name, appname })}`;
    }
  }
  return `nmap://search?${new URLSearchParams({ query: `여수 ${place}`, appname })}`;
}

function createNaverMapLink(plan, place, exactName = false) {
  const link = document.createElement("a");
  link.className = "naver-map-link";
  link.href = naverMapUrl(plan, place, exactName);
  link.textContent = "네이버지도";
  link.setAttribute("aria-label", `${place} 네이버지도 앱에서 열기`);
  return link;
}

function shouldShowNaverMap(activity) {
  return /점심|저녁|간식|카페|구경|관람|산책|케이블카/.test(activity);
}

function renderSchedule(plan, startIdx, endIdx) {
  const rows = selectedScheduleRows(plan, startIdx, endIdx);
  const currentRow = findCurrentScheduleRow(plan);
  const isFullRoute = startIdx === 0 && endIdx === plan.points.length - 1;

    const timeText = document.createElement("span");
    const placeText = document.createElement("strong");

    td.colSpan = 5;
    if (row === currentRow) {
      tr.classList.add("is-current");
      const currentMarker = document.createElement("span");
      currentMarker.className = "current-marker";
      currentMarker.textContent = "지금";
      td.append(currentMarker);

    if (isMovement) {
      const line = document.createElement("div");
      const arrow = document.createElement("span");
      const content = document.createElement("div");
      const summary = document.createElement("strong");
      const route = document.createElement("span");
      const extraActivity = activity.replace(/^이동·?/, "");
      const summaryParts = [note, extraActivity, durationText(time)].filter(Boolean);
      tr.classList.add("movement-row");
      line.className = "movement-line";
      arrow.className = "movement-arrow";
      arrow.textContent = "↓";
      summary.className = "movement-summary";
      summary.textContent = summaryParts.join(" · ");
      route.className = "movement-route";
      route.textContent = `${time} · ${origin} → ${dest}`;
      content.append(summary, route);
      line.append(arrow, content);
      td.append(line);
      tr.append(td);
      body.append(tr);
      return;
    }
    timeText.className = "schedule-time";
    timeText.textContent = time;
    placeText.className = "schedule-place";
    placeText.textContent = travel ? activity : origin && dest ? `${origin} → ${dest}` : dest || origin;
    const placeRow = document.createElement("div");
    placeRow.className = "schedule-place-row";
    placeRow.append(placeText);
    if (!travel && !candidates?.length && shouldShowNaverMap(activity))

    td.append(timeText, placeRow);
    if (travel) {
      const group = document.createElement("div");
      group.className = "travel-group";

        route.className = "traveler-route";
        route.textContent = `${startTime} ${startPlace} → ${endTime} ${endPlace}`;
        content.append(route);
        if (journeyNote) {
          const journeyNoteText = document.createElement("span");
          journeyNoteText.className = "traveler-note";
          journeyNoteText.textContent = journeyNote;
          content.append(journeyNoteText);
        }
        journey.append(badge, content);
        group.append(journey);
      });
      if (travel.meeting) {
        const meeting = document.createElement("div");
        meeting.className = "travel-meeting";
        meeting.textContent = travel.meeting;
        group.append(meeting);
      }
      td.append(group);
    } else if (candidates?.length) {
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      const summaryTitle = document.createElement("span");
      const toggle = document.createElement("span");
      const openLabel = document.createElement("span");
      const closeLabel = document.createElement("span");
      const list = document.createElement("div");
      details.className = "candidate-details";
      summaryTitle.textContent = `${activity} 후보 ${candidates.length}곳`;
      toggle.className = "candidate-toggle";
      openLabel.className = "candidate-open-label";
      openLabel.textContent = "펼쳐보기";
      closeLabel.className = "candidate-close-label";
      closeLabel.textContent = "접기";
      toggle.append(openLabel, closeLabel);
      summary.append(summaryTitle, toggle);
      list.className = "candidate-list";
      candidates.forEach(([name, menu]) => {
        const item = document.createElement("div");
        const heading = document.createElement("div");
        const nameText = document.createElement("strong");
        const menuText = document.createElement("span");
        item.className = "candidate-item";
        heading.className = "candidate-heading";
        nameText.className = "candidate-name";
        nameText.textContent = name;
        menuText.className = "candidate-menu";
        menuText.textContent = menu;
        heading.append(nameText, createNaverMapLink(plan, name, true));
        item.append(heading, menuText);
        list.append(item);
      });
      details.append(summary, list);
      td.append(details);
    } else {
      const detailText = document.createElement("span");
      detailText.className = "schedule-detail";
      detailText.textContent = [activity, note].filter(Boolean).join(" · ");
      td.append(detailText);
    }
    tr.append(td);
    body.append(tr);
  });
}

function drawSelectedRoute() {
  const startIdx = Number(routeStart.value);
  const endIdx = Number(routeEnd.value);
  document.getElementById("route-summary").textContent = selectedRouteSummary(activePlan, startIdx, endIdx);
  renderSchedule(activePlan, startIdx, endIdx);
  drawMap(activePlan, startIdx, endIdx);
}

function fillEndOptions(startIdx, selectedEndIdx) {
  routeEnd.replaceChildren();
  for (let idx = startIdx + 1; idx < activePlan.points.length; idx++) {
    const option = document.createElement("option");
    option.value = idx;
    option.textContent = `${idx + 1}. ${activePlan.points[idx][0]}`;
    routeEnd.append(option);
  }
  routeEnd.value = selectedEndIdx > startIdx ? selectedEndIdx : startIdx + 1;
}

function fillRouteOptions(plan) {
  activePlan = plan;
  routeStart.replaceChildren();
  plan.points.slice(0, -1).forEach(([name], idx) => {
    const option = document.createElement("option");
    option.value = idx;
    option.textContent = `${idx + 1}. ${name}`;
    routeStart.append(option);
  });
  routeStart.value = 0;
  fillEndOptions(0, plan.points.length - 1);
}

function showAllSchedule() {
  routeStart.value = 0;
  fillEndOptions(0, activePlan.points.length - 1);
  drawSelectedRoute();
}

function showFeedback(message) {
  const feedback = document.getElementById("day-feedback");
  clearTimeout(feedbackTimer);
  feedback.textContent = message;
  feedbackTimer = setTimeout(() => feedback.textContent = "", 2500);
}

function focusCurrentSchedule() {
  const todayKey = localDateKey(new Date());
  const dayEntry = Object.entries(activeTrip.days).find(([, plan]) => plan.isoDate === todayKey);
  if (!dayEntry) {
    showFeedback("여행 당일에 현재 일정을 표시해요.");
    return;
  }

  const [key] = dayEntry;
  if (activeDayKey !== key)
    selectDay(key);
  else
    showAllSchedule();
  setActiveView("schedule");
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const currentRow = document.querySelector("#schedule-body tr.is-current");
    if (currentRow) {
      currentRow.scrollIntoView({ behavior: "smooth", block: "center" });
      showFeedback("현재 일정으로 이동했어요.");
    }
  }));
}

function setActiveView(view) {
  activeView = view;
  const isSchedule = view === "schedule";
  document.getElementById("schedule-panel").hidden = !isSchedule;
  document.getElementById("map-panel").hidden = isSchedule;
  document.getElementById("view-schedule").classList.toggle("active", isSchedule);
  document.getElementById("view-map").classList.toggle("active", !isSchedule);
  document.getElementById("view-schedule").setAttribute("aria-selected", isSchedule);
  document.getElementById("view-map").setAttribute("aria-selected", !isSchedule);
  if (!isSchedule) {
    setTimeout(() => {
      map.invalidateSize();
      drawSelectedRoute();
    }, 0);
  }
}

function selectDay(key) {
  const keys = Object.keys(activeTrip.days);
  const plan = activeTrip.days[key];
  const dayIndex = keys.indexOf(key);
  activeDayKey = key;
  document.documentElement.style.setProperty("--accent", plan.color);
  document.querySelectorAll(".day-tabs button").forEach(button => {
    const active = button.dataset.day === key;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", active);
  });
  document.getElementById("day-number").textContent = `DAY ${dayIndex + 1}`;
  document.getElementById("route-title").textContent = `${plan.date} ${plan.day}`;
  document.getElementById("route-note").textContent = plan.note;
  fillRouteOptions(plan);
  refreshDayDistance(plan);
  drawSelectedRoute();
}

function renderDayTabs() {
  const keys = Object.keys(activeTrip.days);
  dayTabs.replaceChildren();
  dayTabs.style.setProperty("--day-count", keys.length);
  keys.forEach(key => {
    const plan = activeTrip.days[key];
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.day = key;
    button.style.setProperty("--tab-color", plan.color);
    button.innerHTML = `<small>${plan.date}</small><strong>${plan.day}</strong><span>${plan.theme}</span>`;
    button.addEventListener("click", () => selectDay(key));
    dayTabs.append(button);
  });
  selectDay(keys[0]);
}

function selectTrip(id) {
  activeTrip = trips.find(trip => trip.id === id);
  document.querySelectorAll(".trip-tabs button").forEach(button => {
    const active = button.dataset.trip === id;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", active);
  });
  renderDayTabs();
  refreshTripDistance(activeTrip);
}

trips.forEach(trip => {
  const button = document.createElement("button");
  button.type = "button";
  button.dataset.trip = trip.id;
  button.textContent = trip.tab;
  button.style.setProperty("--trip-color", trip.color);
  button.addEventListener("click", () => selectTrip(trip.id));
  tripTabs.append(button);
});

routeStart.addEventListener("change", () => {
  fillEndOptions(Number(routeStart.value), Number(routeEnd.value));
  drawSelectedRoute();
});
routeEnd.addEventListener("change", drawSelectedRoute);
document.getElementById("route-all").addEventListener("click", showAllSchedule);
document.getElementById("route-now").addEventListener("click", focusCurrentSchedule);
document.getElementById("view-schedule").addEventListener("click", () => setActiveView("schedule"));
document.getElementById("view-map").addEventListener("click", () => setActiveView("map"));
document.getElementById("back-to-top").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
window.addEventListener("scroll", () => document.getElementById("back-to-top").classList.toggle("show", window.scrollY > 500), { passive: true });

selectTrip(trips[0].id);
setActiveView(activeView);
  </script>
</body>
</html>
