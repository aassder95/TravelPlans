<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111315">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="똥뚜 여행계획 모음">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>똥뚜 여행계획</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="./assets/app.css">
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <h1>똥뚜 여행계획</h1>
      <p id="trip-distance">이번 여행의 발자국 · 거리 계산 중…</p>
    </div>
  </header>

  <main class="page">
    <p id="app-status" class="app-status" role="status">여행 정보를 불러오는 중…</p>
    <nav class="trip-tabs" aria-label="여행 선택"></nav>
    <nav class="day-tabs" aria-label="여행 날짜 선택"></nav>
    <section class="card day-overview" aria-label="선택한 날짜와 동선 범위">
      <div class="route-heading">
        <div><p class="section-label" id="day-number"></p><h2 id="route-title"></h2></div>
        <span class="day-distance" id="day-distance">거리 계산 중…</span>
      </div>
      <div class="route-tools">
        <div class="route-range" aria-label="표시할 동선 구간">
          <label>시작 <select id="route-start"></select></label>
          <span aria-hidden="true">→</span>
          <label>도착 <select id="route-end"></select></label>
        </div>
        <div class="route-actions">
          <button type="button" id="route-now" hidden>지금 일정</button>
          <button type="button" id="route-all" hidden>전체 동선 복원</button>
        </div>
        <p class="day-feedback" id="day-feedback" aria-live="polite"></p>
      </div>
    </section>
    <button type="button" class="today-brief" id="today-brief" hidden aria-label="현재 일정 카드로 이동">
      <span class="today-brief-row">
        <span class="today-brief-badge">지금</span>
        <span><strong class="today-brief-title" id="today-current-title"></strong><small class="today-brief-detail" id="today-current-detail"></small></span>
      </span>
      <span class="today-brief-row" id="today-next-row">
        <span class="today-brief-badge">다음</span>
        <span><strong class="today-brief-title" id="today-next-title"></strong><small class="today-brief-detail" id="today-next-detail"></small></span>
      </span>
    </button>
    <div class="view-switch" role="tablist" aria-label="여행 정보 보기">
      <button type="button" id="view-schedule" role="tab" aria-controls="schedule-panel">일정</button>
      <button type="button" id="view-map" role="tab" aria-controls="map-panel">지도</button>
    </div>

    <section class="card route-card view-panel" id="map-panel" role="tabpanel" aria-labelledby="view-map">
      <div class="map-wrap">
        <div id="route-map" role="img" aria-label="날짜별 여행 동선 지도"></div>
        <div class="map-place-card" id="map-place-card" aria-live="polite" hidden>
          <div class="map-place-heading"><span class="map-place-number" id="map-place-number"></span><span class="map-place-name" id="map-place-name"></span></div>
          <div class="map-place-details" id="map-place-details"></div>
        </div>
      </div>
      <p class="route-summary" id="route-summary"></p>
      <p class="route-note" id="route-note"></p>
      <p class="map-caption" id="route-status" role="status" hidden></p>
    </section>

    <section class="card schedule-card view-panel" id="schedule-panel" role="tabpanel" aria-labelledby="view-schedule">
      <div class="panel-meta" id="row-count"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>시간</th><th>출발지</th><th>도착지</th><th>일정</th><th>비고</th></tr></thead>
          <tbody id="schedule-body"></tbody>
        </table>
      </div>
    </section>

  </main>
  <button type="button" class="back-to-top" id="back-to-top" aria-label="맨 위로">↑</button>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
