  <style>
:root {
  --form-bg:#111315;
  --card-bg:#191d20;
  --card-header-bg:#1e2322;
  --input-bg:#14181a;
  --grid-header-bg:#242a2b;
  --border:#343a3d;
  --text-primary:#e8edeb;
  --text-muted:#a4aeab;
  --accent:#206c4c;
  --accent-hover:#277654;
  --secondary:#24292c;
  --secondary-hover:#30363a;
  --selection:#244f40;
  --focus:#48a47c;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; background:#0d0f10; }
body { min-width:320px; margin:0; background:#0d0f10; color:var(--text-primary); font-family:"Segoe UI","Apple SD Gothic Neo",sans-serif; -webkit-text-size-adjust:100%; }
button,select { font:inherit; }
.hero { width:min(100%,390px); margin:0 auto; border-bottom:1px solid var(--border); background:var(--card-bg); }
.hero__inner { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:calc(12px + env(safe-area-inset-top)) 14px 12px; }
h1 { margin:0; font-family:"Segoe UI Semibold","Segoe UI",sans-serif; font-size:20px; line-height:1.2; }
#trip-date-range { margin:0; color:var(--text-muted); font-size:12px; font-weight:600; white-space:nowrap; }
.page { width:min(100%,390px); margin:0 auto; padding:10px 10px calc(28px + env(safe-area-inset-bottom)); background:var(--form-bg); }
.trip-tabs { display:flex; gap:6px; margin-bottom:8px; overflow-x:auto; scrollbar-width:none; }
.trip-tabs::-webkit-scrollbar { display:none; }
.trip-tabs button { flex:0 0 auto; min-height:36px; padding:7px 11px; border:1px solid var(--border); border-bottom:3px solid transparent; border-radius:6px; background:var(--secondary); color:var(--text-muted); font-size:12px; font-weight:600; cursor:pointer; }
.trip-tabs button.active { border-color:var(--accent); border-bottom-color:var(--focus); background:var(--selection); color:var(--text-primary); }
.day-tabs { display:grid; grid-template-columns:repeat(var(--day-count,3),1fr); overflow:hidden; border:1px solid var(--border); border-radius:8px; background:var(--card-bg); }
.day-tabs button { min-width:0; appearance:none; position:relative; border:0; border-right:1px solid var(--border); padding:10px 8px 12px; background:var(--card-bg); color:var(--text-muted); text-align:left; cursor:pointer; }
.day-tabs button:last-child { border-right:0; }
.day-tabs button::after { content:""; height:3px; position:absolute; left:8px; right:8px; bottom:0; border-radius:3px 3px 0 0; background:var(--focus); transform:scaleX(0); }
.day-tabs button.active { background:var(--selection); color:var(--text-primary); }
.day-tabs button.active::after { transform:scaleX(1); }
.day-tabs small,.day-tabs span { display:block; overflow:hidden; font-size:10px; white-space:nowrap; text-overflow:ellipsis; }
.day-tabs strong { display:block; margin:2px 0; font-size:15px; }
.card { margin-top:10px; padding:12px; background:var(--card-bg); border:1px solid var(--border); border-radius:8px; }
.section-head { display:flex; align-items:flex-start; flex-direction:column; gap:12px; margin-bottom:12px; }
.section-head h2 { margin:0; font-family:"Segoe UI Semibold","Segoe UI",sans-serif; font-size:20px; }
.section-label { margin:0 0 5px; color:var(--focus); font-size:11px; font-weight:700; letter-spacing:.1em; }
.route-tools { width:100%; }
.route-range { width:100%; display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:7px; color:var(--text-muted); font-size:11px; }
.route-range label { min-width:0; display:flex; align-items:flex-start; flex-direction:column; gap:5px; }
.route-range select,.route-range button { width:100%; min-height:38px; border:1px solid var(--border); border-radius:5px; background:var(--input-bg); color:var(--text-primary); }
.route-range select { padding:6px 24px 6px 8px; font-size:12px; }
.route-range button { grid-column:1 / -1; padding:6px 10px; cursor:pointer; }
.route-range select:focus-visible,.route-range button:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
.legend { display:none; }
.map-wrap { overflow:hidden; border:1px solid var(--border); border-radius:6px; background:var(--input-bg); }
#route-map { width:100%; height:440px; background:#dceef1; }
.route-pin { display:flex; align-items:center; justify-content:center; width:28px; height:28px; border:2px solid var(--text-primary); border-radius:50%; background:var(--pin-color); color:var(--text-primary); font-size:12px; font-weight:700; box-shadow:0 3px 8px #0008; }
.route-pin.is-combined { width:40px; border-radius:15px; }
.leaflet-tooltip.place-label { padding:3px 5px; border:1px solid var(--border); border-radius:4px; background:#191d20e8; color:var(--text-primary); font-size:10px; font-weight:600; box-shadow:0 1px 5px #0008; }
.leaflet-tooltip.place-label::before { display:none; }
.leaflet-control-attribution { font-size:9px; }
.route-summary { margin:12px 2px 0; color:var(--text-primary); font-size:13px; font-weight:600; line-height:1.6; }
.route-note { margin:8px 0 0; padding:10px 11px; border-left:3px solid var(--accent); background:var(--input-bg); color:var(--text-muted); font-size:12px; line-height:1.55; }
.map-caption { margin:7px 2px 0; color:var(--text-muted); font-size:10px; line-height:1.4; }
.schedule-card .section-head { flex-direction:row; justify-content:space-between; align-items:flex-end; }
.row-count { color:var(--text-muted); font-size:11px; white-space:nowrap; }
.table-wrap { border:0; }
table,tbody { display:block; width:100%; }
thead { display:none; }
tbody { display:grid; gap:7px; }
tbody tr { display:block; padding:11px 12px; border:1px solid var(--border); border-radius:6px; background:var(--input-bg); }
.schedule-item { display:block; padding:0; border:0; background:transparent; overflow-wrap:anywhere; }
.schedule-time { display:block; margin-bottom:5px; color:var(--focus); font-size:11px; font-weight:700; }
.schedule-place { display:block; color:var(--text-primary); font-size:15px; font-weight:700; line-height:1.4; }
.schedule-detail { display:block; margin-top:6px; padding-top:6px; border-top:1px solid var(--border); color:var(--text-muted); font-size:11px; line-height:1.4; }
footer { display:flex; justify-content:space-between; gap:10px; padding:18px 3px 0; color:var(--text-muted); font-size:10px; }
footer strong { color:var(--text-primary); }
@media (min-width:391px) {
  .hero,.page { box-shadow:0 0 30px #0007; }
}
@media print {
  .trip-tabs,.day-tabs,.route-range { display:none; }
  .card { break-inside:avoid; }
}

function segmentLocations(plan, segment) {
  return segment.points.map(index => {
    const [, lon, lat] = plan.points[index];
    return [lon, lat];
  });
}

async function loadRoadRoute(plan, segment) {
  const locations = segmentLocations(plan, segment);
  if (segment.mode === "cable")
    return locations.map(([lon, lat]) => [lat, lon]);

  const server = segment.mode === "foot" ? "https://routing.openstreetmap.de/routed-foot" : "https://router.project-osrm.org";
  const coordinates = locations.map(([lon, lat]) => `${lon},${lat}`).join(";");
  const response = await fetch(`${server}/route/v1/driving/${coordinates}?overview=full&geometries=geojson`);
  if (!response.ok)
    throw new Error(`경로 서버 응답 오류: ${response.status}`);

  const data = await response.json();
  if (data.code !== "Ok" || !data.routes?.[0]?.geometry?.coordinates)
    throw new Error(data.message || "경로를 찾지 못했습니다.");

  return data.routes[0].geometry.coordinates.map(([lon, lat]) => [lat, lon]);
}

function filteredSegments(plan, startIdx, endIdx) {
  const isFullRoute = startIdx === 0 && endIdx === plan.points.length - 1;
  if (isFullRoute)
    return plan.segments;

  const segments = [];
  plan.segments.forEach(segment => {
    let run = [];
    for (let idx = 0; idx < segment.points.length - 1; idx++) {
      const start = segment.points[idx];
      const end = segment.points[idx + 1];
      const isSelected = start >= startIdx && end <= endIdx && start < end;
      if (isSelected) {
        if (run.length === 0) run.push(start);
        run.push(end);
      } else if (run.length > 0) {
        segments.push({ mode: segment.mode, points: run });
        run = [];
      }
    }
    if (run.length > 0)
      segments.push({ mode: segment.mode, points: run });
  });
  return segments;
}

  const status = document.getElementById("route-status");
  const bounds = L.latLngBounds();
  const segments = filteredSegments(plan, startIdx, endIdx);
  routeLayers.clearLayers();
  status.textContent = "실제 도로 경로를 불러오는 중...";

  const visiblePoints = new Map();
  plan.points.forEach(([name, lon, lat], index) => {
    if (index < startIdx || index > endIdx)
      return;

    const locationKey = `${lon},${lat}`;
    if (!visiblePoints.has(locationKey))
      visiblePoints.set(locationKey, { lon, lat, names: [], indexes: [] });
    const point = visiblePoints.get(locationKey);
    point.names.push(name);
    point.indexes.push(index);
    bounds.extend([lat, lon]);
  });

  visiblePoints.forEach(({ lon, lat, names, indexes }) => {
    const isCombined = indexes.length > 1;
    const width = isCombined ? 42 : 30;
    const numbers = indexes.map(index => index + 1).join("·");
    const labels = [...new Set(names)].join(" / ");
    const directionIndex = indexes[0];
    const icon = L.divIcon({ className: "", html: `<span class="route-pin${isCombined ? " is-combined" : ""}" style="--pin-color:${plan.color}">${numbers}</span>`, iconSize: [width, 30], iconAnchor: [width / 2, 15] });
    L.marker([lat, lon], { icon }).bindTooltip(labels, { permanent: true, direction: directionIndex % 2 ? "bottom" : "top", className: "place-label", offset: [0, directionIndex % 2 ? 12 : -12] }).addTo(routeLayers);
  });

  map.fitBounds(bounds, { padding: [45, 45], maxZoom: 15 });
  setTimeout(() => map.invalidateSize(), 0);

  if (segments.length === 0) {
    status.textContent = "선택한 번호 사이에 이어지는 동선이 없습니다.";
    return;
  }

  const results = await Promise.allSettled(segments.map(async segment => ({ segment, locations: await loadRoadRoute(plan, segment) })));
  if (requestId !== routeRequestId)
    return;

  let failureCnt = 0;
  results.forEach((result, index) => {
    const segment = segments[index];
    let locations;
    if (result.status === "fulfilled") locations = result.value.locations;
    else {
      failureCnt++;
      locations = segmentLocations(plan, segment).map(([lon, lat]) => [lat, lon]);
    }

    L.polyline(locations, {
      color: plan.color,
      weight: segment.mode === "foot" ? 5 : 6,
      opacity: .88,
      dashArray: segment.mode === "foot" ? "3 9" : segment.mode === "cable" ? "12 9" : null,
      lineCap: "round",
      lineJoin: "round"
    }).addTo(routeLayers);
  });

  status.textContent = failureCnt === 0 ? "OpenStreetMap 실제 도로 기준 · 교통 상황은 반영하지 않음" : `일부 경로 ${failureCnt}개를 불러오지 못해 해당 구간만 직선으로 표시했습니다.`;
}

function selectedRouteSummary(plan, startIdx, endIdx) {
  if (startIdx === 0 && endIdx === plan.points.length - 1)
    return plan.summary;

  return plan.points.slice(startIdx, endIdx + 1).map(([name], idx) => `${startIdx + idx + 1}. ${name}`).join(" → ");
}

function placeMatches(schedulePlace, pointName) {
  if (!schedulePlace)
    return false;

  const compactPlace = schedulePlace.replace(/\([^)]*\)/g, "").replace(/\s/g, "");
  const compactPoint = pointName.replace(/\([^)]*\)/g, "").replace(/\s/g, "");
  if (compactPlace.includes(compactPoint) || compactPoint.includes(compactPlace))
    return true;

  return pointName.split(/·|\/|또는/).map(value => value.replace(/\s/g, "")).filter(value => value.length > 1).some(value => compactPlace.includes(value));
}

function pointRowIndexes(plan) {
  let searchIdx = 0;
  return plan.points.map(([pointName]) => {
    let fallbackIdx = -1;
    let anchorIdx = -1;
    for (let rowIdx = searchIdx; rowIdx < plan.rows.length; rowIdx++) {
      const [, origin, dest] = plan.rows[rowIdx];
      if (!placeMatches(dest, pointName))
        continue;

      if (fallbackIdx < 0) fallbackIdx = rowIdx;
      if (!origin) {
        anchorIdx = rowIdx;
        break;
      }
    }
    const rowIdx = anchorIdx >= 0 ? anchorIdx : fallbackIdx;
    if (rowIdx >= 0) searchIdx = rowIdx;
    return rowIdx;
  });
}

function selectedScheduleRows(plan, startIdx, endIdx) {
  if (startIdx === 0 && endIdx === plan.points.length - 1)
    return plan.rows;

  const rowIndexes = pointRowIndexes(plan);
  const startRowIdx = rowIndexes[startIdx];
  const endRowIdx = rowIndexes[endIdx];
  if (startRowIdx < 0 || endRowIdx < startRowIdx)
    return [];

  return plan.rows.slice(startRowIdx, endRowIdx + 1);
}

function renderSchedule(plan, startIdx, endIdx) {
  const rows = selectedScheduleRows(plan, startIdx, endIdx);
  const isFullRoute = startIdx === 0 && endIdx === plan.points.length - 1;
  document.getElementById("row-count").textContent = isFullRoute ? `${rows.length}개 일정` : `${rows.length}개 일정 · ${startIdx + 1}→${endIdx + 1}번`;

  const body = document.getElementById("schedule-body");
  body.replaceChildren();
  rows.forEach(row => {
    const [time, origin, dest, activity, note] = row;
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    const timeText = document.createElement("span");
    const placeText = document.createElement("strong");
    const detailText = document.createElement("span");
    td.className = "schedule-item";
    td.colSpan = 5;
    timeText.className = "schedule-time";
    timeText.textContent = time;
    placeText.className = "schedule-place";
    placeText.textContent = origin && dest ? `${origin} → ${dest}` : dest || origin;
    detailText.className = "schedule-detail";
    detailText.textContent = [activity, note].filter(Boolean).join(" · ");
    td.append(timeText, placeText, detailText);
    tr.append(td);
    body.append(tr);
  });
}

function drawSelectedRoute() {
  const startIdx = Number(routeStart.value);
  const endIdx = Number(routeEnd.value);
  document.getElementById("route-summary").textContent = selectedRouteSummary(activePlan, startIdx, endIdx);
  renderSchedule(activePlan, startIdx, endIdx);
  drawMap(activePlan, startIdx, endIdx);
}

function fillEndOptions(startIdx, selectedEndIdx) {
  routeEnd.replaceChildren();
  for (let idx = startIdx + 1; idx < activePlan.points.length; idx++) {
    const option = document.createElement("option");
    option.value = idx;
    option.textContent = `${idx + 1}. ${activePlan.points[idx][0]}`;
    routeEnd.append(option);
  }
  routeEnd.value = selectedEndIdx > startIdx ? selectedEndIdx : startIdx + 1;
}

function fillRouteOptions(plan) {
  activePlan = plan;
  routeStart.replaceChildren();
  plan.points.slice(0, -1).forEach(([name], idx) => {
    const option = document.createElement("option");
    option.value = idx;
    option.textContent = `${idx + 1}. ${name}`;
    routeStart.append(option);
  });
  routeStart.value = 0;
  fillEndOptions(0, plan.points.length - 1);
}

function selectDay(key) {
  const keys = Object.keys(activeTrip.days);
  const plan = activeTrip.days[key];
  const dayIndex = keys.indexOf(key);
  document.documentElement.style.setProperty("--accent", plan.color);
  document.querySelectorAll(".day-tabs button").forEach(button => {
    const active = button.dataset.day === key;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", active);
  });
  document.getElementById("day-number").textContent = `DAY ${dayIndex + 1}`;
  document.getElementById("route-title").textContent = `${plan.date} 동선`;
  document.getElementById("route-note").textContent = plan.note;
  document.getElementById("schedule-title").textContent = `${plan.day} 계획표`;
  fillRouteOptions(plan);
  drawSelectedRoute();
}

function renderDayTabs() {
  const keys = Object.keys(activeTrip.days);
  dayTabs.replaceChildren();
  dayTabs.style.setProperty("--day-count", keys.length);
  keys.forEach(key => {
    const plan = activeTrip.days[key];
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.day = key;
    button.style.setProperty("--tab-color", plan.color);
    button.innerHTML = `<small>${plan.date}</small><strong>${plan.day}</strong><span>${plan.theme}</span>`;
    button.addEventListener("click", () => selectDay(key));
    dayTabs.append(button);
  });
  selectDay(keys[0]);
}

function selectTrip(id) {
  activeTrip = trips.find(trip => trip.id === id);
  document.getElementById("trip-date-range").textContent = activeTrip.dateRange;
  document.querySelectorAll(".trip-tabs button").forEach(button => {
    const active = button.dataset.trip === id;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", active);
  });
  renderDayTabs();
}

trips.forEach(trip => {
  const button = document.createElement("button");
  button.type = "button";
  button.dataset.trip = trip.id;
  button.textContent = trip.tab;
  button.style.setProperty("--trip-color", trip.color);
  button.addEventListener("click", () => selectTrip(trip.id));
  tripTabs.append(button);
});

routeStart.addEventListener("change", () => {
  fillEndOptions(Number(routeStart.value), Number(routeEnd.value));
  drawSelectedRoute();
});
routeEnd.addEventListener("change", drawSelectedRoute);
document.getElementById("route-all").addEventListener("click", () => {
  routeStart.value = 0;
  fillEndOptions(0, activePlan.points.length - 1);
  drawSelectedRoute();
});

selectTrip(trips[0].id);
  </script>
</body>
